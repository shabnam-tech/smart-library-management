spring.application.name=borrowing-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

member-service.url=http://localhost:8081
catalog-service.url=http://localhost:8082

# Days between borrow date and due date
library.borrowing.loan-period-days=14

# Cron for the overdue-detection scheduler: default = every hour, on the hour
library.overdue-check.cron=0 0 * * * *
